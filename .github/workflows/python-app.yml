
name: SIMATS Event Sphere CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -v

  docker-build-push:
    name: Docker Build and Push
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/samrakshini-g/simats-event-sphere:latest
            ghcr.io/samrakshini-g/simats-event-sphere:${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes
    needs: docker-build-push
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Kubernetes configuration
        run: kubectl apply -f k8s-deployment.yaml

      - name: Deploy newly built Docker image
        run: kubectl set image deployment/simats-event-sphere simats-event-sphere=ghcr.io/samrakshini-g/simats-event-sphere:${{ github.sha }}

      - name: Verify Kubernetes deployment
        run: kubectl rollout status deployment/simats-event-sphere --timeout=180s
