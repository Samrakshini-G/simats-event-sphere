name: SIMATS Event Sphere CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    # Keep your existing complete build-and-test job here

  docker-build-push:
    # Keep your existing complete docker-build-push job here

  deploy:
    name: Deploy to Kubernetes
    needs: docker-build-push
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Kubernetes configuration
        run: kubectl apply -f k8s-deployment.yaml

      - name: Deploy newly built Docker image
        run: kubectl set image deployment/simats-event-sphere simats-event-sphere=ghcr.io/samrakshini-g/simats-event-sphere:${{ github.sha }}

      - name: Verify Kubernetes deployment
        run: kubectl rollout status deployment/simats-event-sphere --timeout=180s
