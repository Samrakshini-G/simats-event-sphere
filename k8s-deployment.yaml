apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: simats-event-sphere-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simats-event-sphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simats-event-sphere
  template:
    metadata:
      labels:
        app: simats-event-sphere
    spec:
      initContainers:
        - name: initialize-storage
          image: busybox:1.36
          command: ["sh", "-c", "touch /data/simats_events.db"]
          volumeMounts:
            - name: app-storage
              mountPath: /data
      containers:
        - name: simats-event-sphere
          image: ghcr.io/samrakshini-g/simats-event-sphere:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
          volumeMounts:
            - name: app-storage
              mountPath: /app/simats_events.db
              subPath: simats_events.db
          readinessProbe:
            tcpSocket:
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: simats-event-sphere-storage
---
apiVersion: v1
kind: Service
metadata:
  name: simats-event-sphere-service
spec:
  type: NodePort
  selector:
    app: simats-event-sphere
  ports:
    - port: 8501
      targetPort: 8501
      nodePort: 30081
